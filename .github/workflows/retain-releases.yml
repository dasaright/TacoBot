name: Archive older releases

on:
  workflow_run:
    workflows: ["Build Windows Relay"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/retain-releases.yml]

permissions:
  contents: write

concurrency:
  group: music-release-retention
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub has no archived release state. Drafts preserve notes, assets,
      # and tags while removing old releases from the public release list.
      # workflow_run also handles releases created with GITHUB_TOKEN, whose
      # publication does not trigger another release-event workflow.
      - name: Keep latest public and archive older releases as drafts
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            let latest;
            try {
              ({ data: latest } = await github.rest.repos.getLatestRelease(repo));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('No stable published release; nothing to archive.');
              return;
            }
            if (!latest.assets.some(a => a.state === 'uploaded' &&
                a.size > 0 && a.name === 'TacoBot-Windows.zip')) {
              throw new Error('Latest release has no completed Windows ZIP; refusing to archive.');
            }
            const releases = await github.paginate(
              github.rest.repos.listReleases, { ...repo, per_page: 100 }
            );
            const older = releases.filter(r =>
              !r.draft && r.id !== latest.id &&
              Date.parse(r.published_at) <= Date.parse(latest.published_at)
            );
            if (older.some(r => r.immutable)) {
              throw new Error('An older release is immutable and cannot be converted to a draft.');
            }
            let count = 0;
            for (const release of older) {
              // Stop if another publication changes latest during this run.
              const { data: current } = await github.rest.repos.getLatestRelease(repo);
              if (current.id !== latest.id) {
                throw new Error('Latest release changed; rerun to recompute the archive list.');
              }
              await github.rest.repos.updateRelease({
                ...repo, release_id: release.id, draft: true
              });
              core.info('Archived as draft: ' + release.tag_name);
              count++;
            }
            await core.summary
              .addHeading('Release archive')
              .addRaw('Kept public: ' + latest.tag_name + '\n')
              .addRaw('Older releases preserved as drafts: ' + count + '\n')
              .write();
